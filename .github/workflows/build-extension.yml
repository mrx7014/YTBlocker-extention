name: Build extensions

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and package web and Android extensions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required files and icons
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            manifest.json
            platforms/web/manifest.json
            platforms/android/manifest.json
            build-extensions.sh
            background.js
            common.js
            content.js
            content.css
            popup.html
            popup.js
            popup.css
            options.html
            options.js
            options.css
            README.md
            LICENSE
            icons/icon16.png
            icons/icon32.png
            icons/icon48.png
            icons/icon128.png
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done

          file icons/icon16.png | grep -F '16 x 16'
          file icons/icon32.png | grep -F '32 x 32'
          file icons/icon48.png | grep -F '48 x 48'
          file icons/icon128.png | grep -F '128 x 128'

      - name: Validate manifests and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool platforms/web/manifest.json >/dev/null
          python3 -m json.tool platforms/android/manifest.json >/dev/null
          for file in *.js; do node --check "$file"; done

      - name: Build both extension packages
        run: bash build-extensions.sh

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-channel-blocker-v1.0.0
          path: |
            dist/youtube-channel-blocker-web-v1.0.0.zip
            dist/youtube-channel-blocker-android-v1.0.0.zip
          if-no-files-found: error
          retention-days: 30
